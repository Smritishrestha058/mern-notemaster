<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display:flex;
	        align-items:center;
	        justify-content:center;
        }
        .box{
            width:280px;
	        height:280px;
	        display:flex;
	        align-items:center;
	        justify-content:center;
	        /* font-family: "Inconsolata", monospace; */
	        /* font-size: 28px; */
	        /* border:1px solid #c39f76; */
	        box-sizing:border-box;
            position: relative;
            
        }
        .circle1{
            position: absolute;
            width: 60px;
            height: 60px;
            border: 7px solid blue;
            border-radius: 50%;
            top: 0;
            left: 0;
        }
        .circle2{
            position: absolute;
            width: 60px;
            height: 60px;
            border: 7px solid yellow;
            border-radius: 50%;
            top: 20px;
            left: 50px;
            
        }
        .circle3{
            position: absolute;
            width: 60px;
            height: 60px;
            border: 7px solid black;
            border-radius: 50%;
            top: 0;
            
        }
        .circle4{
            position: absolute;
            width: 60px;
            height: 60px;
            border: 7px solid green;
            border-radius: 50%;
            top: 20px;
            left: 150px;
        }
        .circle5{
            position: absolute;
            width: 60px;
            height: 60px;
            border: 7px solid red;
            border-radius: 50%;
            top: 0;
            left: 200px;
        }
    </style>
</head>
<body>
    <div class="box">
            <div class="circle1"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
            <div class="circle4"></div>
            <div class="circle5"></div>
    </div>
</body>
</html>

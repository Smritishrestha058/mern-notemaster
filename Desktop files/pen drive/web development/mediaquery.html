<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box
        {
            text-align: center;
            font-size: 50px;
            display: none;
        }
        @media (min-width: 800px)
        {
            #box4
            {
                display: block;
                background-color: red;
            }
        }
        @media (min-width:500px) and (max-width:800px)
        {
            #box3
            {
                display: block;
                background-color: green;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">Samsung</div>
        <div class="box" id="box2">Iphone</div>
        <div class="box" id="box3">Ipad</div>
        <div class="box" id="box4">Laptop</div>
    </div>
</body>
</html>

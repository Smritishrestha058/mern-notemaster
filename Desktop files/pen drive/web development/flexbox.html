<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            border: 2px solid red;
            width: 100%;
            height: 600px;
            display: flex;
            /*flex-direction: row-reverse;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row;
            flex-wrap: nowrap;
            flex-wrap: wrap;*/
            flex-flow: row-reverse wrap;
            /* justify-content:ecnter; 
            it keeps content horizontally center */
            justify-content: center;
            /* align-items:ecnter; 
            it keeps content vertically  center */
            align-items: center;
            align-items: flex-end;
            align-items: flex-start;
            /* it assigns equal space between two content only */
            justify-content: space-between;
            /* it assigns equal space between two content as well as same space at start and end */
            justify-content: space-evenly;
            /* it assigns equal space by all content on all side as well as at the start and at end*/
            justify-content: space-around;
        }
        .box
        {
            border: 2px solid blue;
            margin: 5px;
            height: 60px;
            width: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input id="display" readonly>
        <div class="keys">
            <button appendtoDisplay("+")>+</button>
            <button appendtoDisplay("7")>7</button>
            <button appendtoDisplay("8")>8</button>
            <button appendtoDisplay("9")>9</button>
            <button appendtoDisplay("-")>-</button>
            <button appendtoDisplay("4")>4</button>
            <button appendtoDisplay("5")>5</button>
            <button appendtoDisplay("6")>6</button>
            <button appendtoDisplay("*")>*</button>
            <button appendtoDisplay("3")>3</button>
            <button appendtoDisplay("2")>2</button>
            <button appendtoDisplay("1")>1</button>
            <button appendtoDisplay("/")>/</button>
            <button appendtoDisplay("C")>C</button>
            <button appendtoDisplay("0")>0</button>
        </div>
    </div>
</body>
</html>

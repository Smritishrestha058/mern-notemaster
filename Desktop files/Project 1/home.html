
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Progress Bar</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress {
            height: 25px;
            background-color: #50abd5;
            width: 0%; /* Default to 0% */
            border-radius: 25px 0 0 25px;
        }

        .input-group {
            margin: 10px 0;
        }
        .box, .box2, .budget-container, .transaction-container{
            background-color: #93C572;
            color: white;
            padding: 10px;
            margin: 0px 20px;
            border-radius: 10px;
            font-size: 20px;
        }
        .dashboard{
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }
        .transaction-container{
            /* background-color: #f1f1f1;
            color: black; */
            /* padding: 20px; */
            
            display: grid;
            place-content: center;
            
        }
        .transaction{
            height: 500px;
            width: 900px;
            display: grid;
            place-content: center;
        }
        .recent_transaction{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }
        h1{
            padding-left: 10px;
            font-family: sans-serif;
        }
        .transaction-group{
            width: 400px;
            height: 100px;
            background-color: white;
            margin: 15px 20px 15px 20px;
            display: flex;
            flex-direction: row;
            border-radius: 7px;
        }
        .navbar{
    background-color: #cfe8c7;    
    height: 10vh;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.navbar a{
    text-decoration: none;
    color: black;
    float: right;
    padding: 5px 60px;
    margin-right: 15px;
    font-size: 25px;
    font-family: "Ubuntu", sans-serif;
}
.navbar a:hover{
    background-color: #07001f;
    color: #f1f1f1;
}
.logoutbtn {
    font-size: 20px;
    cursor: pointer;
    background-color: #111;
    color: white;
    padding: 10px 15px;
    border: none;
    text-decoration: none;
    margin-right: 15px;
    border-radius: 5px;
    transition: 0.3s;
}
  
.logoutbtn:hover {
    background-color: #444;
    color: #f1f1f1;
    text-decoration: none;
}
.contact{
    margin: 0;
    height: 90vh;
    width: 100%;
    display: grid;
    place-content: center;
    background-color: #f1f1f1;
   }
  .contact_form{
    height: 500px;
    width: 550px;
    display: grid;
    place-content: center;
  }
  .contact form{
    margin: 0px;
  }
  .contact h1{
    font-family: sans-serif;
    padding: 10px 0px;
    margin: 0;
  }
  .contact .input-group{
    margin: 15px 0px;
    width: 400px;
  }
  .contact .input-group input{
    width: 100%;
    padding: 10px;
    font-size: 1em;
    border: none;
    outline: none;
    border-radius: 5px;
    background-color: #fff;
    color: black;
  }
  .contact input::placeholder {
    color: #745f5f; 
  }
  .contact .input-group textarea{
    width: 100%;
    resize: none;
    padding: 10px;
    border: none;
    outline: none;
    font-size: 1.5em;
    border-radius: 5px;
  }
  .contact .Send{
    width: 40%;
    height: 40px;
    font-size: 1.5em;
    border-radius: 5px;
    border: none;
    outline: none;
    background-color: rgb(36, 36, 155);
    color: white;
    padding: 0;
    transition: 0.3s;
  }
  .Send:hover{
    background-color: rgb(49, 57, 214);
    color: black;
  }
  .add_transaction{
    display: flex;
    align-items: center;
  }
  .addbtn{
    margin-right: 20px;
    font-size: 45px;
    border: none;
    outline: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-color: green;
    color: white;
  }
  .addbtn:hover{
    cursor: pointer;
    background-color: white;
    color: green;
  }
  .box2{
    display: flex;
    justify-content: space-between;
  }
    </style>
</head>
<body>
    <div id="Home" class="home">
        <div id="navbar" class="navbar">
            <div id="logo"></div>
            <div class="list">
                <a href="#Contact" onclick="showcontactform()">Contact Us</a>
                <a href="#Services">Calendar</a>
                <a href="#about">Analysis</a>
                <a href="#Home" onclick="showDashboard()">Home</a>
            </div>
            <div id="Login">
                <button class="logoutbtn">Log Out</button>
            </div>
        </div>
        <div id="dashboard" class="dashboard">
            <div class="box">
                <p>Welcome <b>Smriti</b></p>
            </div>
            <div class="box2">
                <div class="balance">
                    <div class="remaining_balance">
                        <p>Remaining Balance:</p>
                    </div>
                    <div class="expenses">
                        <p>Expenses:</p>
                    </div>
                    <div class="income">
                        <p>Income:</p>
                    </div>
                </div>
                <div class="add_transaction">
                    <button class="addbtn">+</button>
                </div>
            </div>
            
            <div class="budget-container">
                <div class="input-group">
                    <label for="total-budget">Total Budget: </label>
                    <input type="number" id="total-budget" placeholder="Enter total budget">
                </div>
            
                <div class="input-group">
                    <label for="amount-spent">Amount Spent: </label>
                    <input type="number" id="amount-spent" placeholder="Enter amount spent">
                </div>
            
                <button onclick="updateProgressBar()">Update Progress Bar</button>
            
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
            
                <p id="progress-text"></p>
            </div>
        
            <div class="transaction-container">
                <h1>RECENT TRANSACTIONS</h1>
                <div class="transaction">
                    <div class="recent_transaction">
                        <div class="transaction-group">
        
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                        <div class="transaction-group">
                            
                        </div>
                    </div>
        
                </div>
            </div>
        </div>
    </div>
    

    <div class="contact" id="contact" style="display: none;">
        <div class="contact_form">
          <h1>Contact Us</h1>
          <form>
            <div class="input-group">
              <input type="text" name="Name" id="Name" placeholder="Name" required>
            </div>
            <div class="input-group">
              <input type="email" name="Email" id="Email" placeholder="Email" required>
            </div>
            <div class="input-group">
              <textarea cols="" rows="5" placeholder="Your message here"></textarea>
            </div>
            <input type="submit" class="Send" value="Send" name="Send">
          </form>
        </div>
      </div>
    <script>
        let contact_form = document.getElementById("contact");
        let dashboard = document.getElementById("dashboard");
        let navbar = document.getElementById("navbar");
        function showcontactform() {
            contact_form.style.display = "grid";
            dashboard.style.display = "none";
            navbar.style.display = "";
        }
        function showDashboard() {
            contact_form.style.display = "none";
            dashboard.style.display = "grid";
        }
        function updateProgressBar() {
            // Get user input values
            let totalBudget = document.getElementById('total-budget').value;
            let amountSpent = document.getElementById('amount-spent').value;

            // Calculate percentage spent
            let percentageSpent = (amountSpent / totalBudget) * 100;

            // Update progress bar width
            document.getElementById('progress').style.width = percentageSpent + '%';

            // Update progress text
            document.getElementById('progress-text').innerText = 
                percentageSpent.toFixed(2) + '% of your budget spent';
        }
    </script>

</body>
</html>

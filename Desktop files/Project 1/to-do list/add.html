<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/490e0fe6fe.js" crossorigin="anonymous"></script>
    <style>
        body{
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .top{
            margin: 0;
            background-color: #469Cf8;
            /* #5489dc */
            height: 70px;
            width: 300px;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }
        button{
            border-radius: 10px;
            background-color: #5489DC;
            color: white;
            border: none;
            font-size: 25px;
            margin: 10px;
            padding: 10px;
        }
        button:hover{
            background-color: aqua;
            color: blue;
        }
        .form{
            height: 95vh;
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin: 70px;
        }
        .first{
            display: flex;
            justify-content: center;
            align-items: center;
            justify-content: space-evenly;
        }
        input{
            padding: 5px;
            font-size: 25px;
            border-radius: 5px;
        }
        select{
            padding: 5px;
            font-size: 25px;
            border-radius: 5px;
            width: 300px;
        }

        textarea{
            margin: 30px;
            padding: 15px;
            font-size: 25px;
            color: #5489DC;
            height: 150px;
            width: 93%;
            border-radius: 10px;
        }
        .add-btn{
            display: flex;
            justify-content: end;
        }
    </style>
</head>
<body>
    <div class="add">
        <div class="top">
            <div class="buttons">
               <button class="link" onclick="openexpenses(event, 'Form')" id="defaultOpen">Expenses</button>
               <button class="link" onclick="openincome(event, 'Form')">Income</button> 
            </div>
        </div>
        <div id = "page1" class="form">
            <div class="first">
                    <!-- <i class="fa-solid fa-dollar-sign"></i> -->
                    <input type="text" id="amt" placeholder="Amount" required>
                
                </form>
                <form id="input-group">
                    <!-- <input type="text" id="category" placeholder="Category" required> -->
                    <select id="category" required>

                    </select>
                </form>
                <form id="input-group">
                    <!-- <input type="text" id="pay" placeholder="Payment Method" required> -->
                    <select>
                        <option>Cash</option>
                        <option>Cheque</option>
                        <option>Esewa</option>
                        <option>Khalti</option>
                    </select>
                </form>
            </div>
            <div class="second">
                <form id="input-group">
                    <textarea id="note" placeholder="Remarks"></textarea>
                </form>
            </div>
            <div class="add-btn">
                <button class="btn">Add</button>
            </div>
        </div>
        <div id = "page2" class="form">
            <div class="first">
                    <!-- <i class="fa-solid fa-dollar-sign"></i> -->
                    <input type="text" id="amt" placeholder="Aount" required>
                
                </form>
                <form id="input-group">
                    <!-- <input type="text" id="category" placeholder="Category" required> -->
                    <select id="category" required>

                    </select>
                </form>
                <form id="input-group">
                    <!-- <input type="text" id="pay" placeholder="Payment Method" required> -->
                    <select>
                        <option>Cash</option>
                        <option>Cheque</option>
                        <option>Esewa</option>
                        <option>Khalti</option>
                    </select>
                </form>
            </div>
            <div class="second">
                <form id="input-group">
                    <textarea id="note" placeholder="Remarks"></textarea>
                </form>
            </div>
            <div class="add-btn">
                <button class="btn">Add</button>
            </div>
        </div>
        
    </div>
    <script>
        function openexpenses(evt, tabName) {
            var i, form, link;
            form = document.getElementsByClassName("form");
            for (i=0; i<form.length; i++) {
                form[i].style.display="none";
            }
            link=document.getElementsByClassName("link");
            for (i=0; i < link.length; i++) {
                link[i].className = link[i].className.replace("active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += "active";
        }
        document.getElementById('defaultOpen').click();
        fetch('addlist.html')
            .then(response => response.text())
            .then(html => {
                const expensesList = document.getElementById('expenses-list');
                const categories = expensesList.getElementsByTagName('li');
                const categorySelect = document.getElementById('category');

                // populate category dropdown
                Array.prototype.forEach.call(categories, (category) => {
                    const option = document.createElement('option');
                    option.text = category.textContent;
                    option.value = category.textContent;
                    categorySelect.appendChild(option);
                });
            });
    </script>
    
</body>
</html>

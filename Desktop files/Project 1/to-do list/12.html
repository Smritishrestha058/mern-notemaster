<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/490e0fe6fe.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .top {
            margin: 0;
            background-color: #469Cf8;
            height: 70px;
            width: 300px;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        button {
            border-radius: 10px;
            background-color: #5489DC;
            color: white;
            border: none;
            font-size: 25px;
            margin: 10px;
            padding: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: aqua;
            color: blue;
        }
        

        .form {
            display: none;
            height: 95vh;
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin: 70px;
        }

        .first {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 40px;
        }

        input,
        select {
            padding: 5px;
            font-size: 25px;
            border-radius: 5px;
            width: 300px;
        }

        textarea {
            margin: 20px 30px;
            padding: 15px;
            font-size: 25px;
            color: #5489DC;
            height: 150px;
            width: 93%;
            border-radius: 10px;
        }

        .add-btn {
            display: flex;
            justify-content: end;
        }
    </style>
</head>

<body>
    <div class="add">
        <div class="top">
            <div class="buttons">
                <button class="link" onclick="openTab(event, 'page1')" id="defaultOpen">Expenses</button>
                <button class="link" onclick="openTab(event, 'page2')">Income</button>
            </div>
        </div>
        <div id="page1" class="form">
            <div class="first">
                <input type="text" id="amt" placeholder="Amount" required>
                <select id="category" required>
                    <!-- Categories will be loaded here -->
                </select>
                <select>
                    <option>Cash</option>
                    <option>Cheque</option>
                    <option>Esewa</option>
                    <option>Khalti</option>
                </select>
            </div>
            <div class="second">
                <textarea id="note" placeholder="Remarks"></textarea>
            </div>
            <div class="add-btn">
                <button class="btn">Add</button>
            </div>
        </div>

        <div id="page2" class="form">
            <div class="first">
                <input type="text" id="amt-income" placeholder="Amount" required>
                <select id="category-income" required>
                    <!-- Categories for income will be loaded here -->
                </select>
                <select>
                    <option>Cash</option>
                    <option>Cheque</option>
                    <option>Esewa</option>
                    <option>Khalti</option>
                </select>
            </div>
            <div class="second">
                <textarea id="note-income" placeholder="Remarks"></textarea>
            </div>
            <div class="add-btn">
                <button class="btn">Add</button>
            </div>
        </div>
    </div>

    <script>
        // Function to switch between tabs
        function openTab(evt, tabName) {
            var i, form, link;
            form = document.getElementsByClassName("form");
            for (i = 0; i < form.length; i++) {
                form[i].style.display = "none";
            }
            link = document.getElementsByClassName("link");
            for (i = 0; i < link.length; i++) {
                link[i].className = link[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "flex";
            evt.currentTarget.className += " active";
        }

        document.getElementById("defaultOpen").click();

        // Fetch categories from external HTML file and populate dropdowns
        fetch('addlist.html')
    .then(response => response.text())
    .then(html => {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        // Get expense categories
        const expenseCategories = tempDiv.querySelectorAll('#expenses-list li');
        const categorySelect = document.getElementById('category');

        // Populate expense dropdown
        expenseCategories.forEach(category => {
            const option = document.createElement('option');
            option.textContent = category.childNodes[0].textContent.trim();
            option.value = category.childNodes[0].textContent.trim();
            categorySelect.appendChild(option);
        });

        // Get income categories
        const incomeCategories = tempDiv.querySelectorAll('#income-list li');
        const categoryIncomeSelect = document.getElementById('category-income');

        // Populate income dropdown
        incomeCategories.forEach(category => {
            const option = document.createElement('option');
            option.textContent = category.childNodes[0].textContent.trim();
            option.value = category.childNodes[0].textContent.trim();
            categoryIncomeSelect.appendChild(option);
        });
    })
    .catch(error => console.error('Error fetching category list:', error));

    </script>
</body>

</html>

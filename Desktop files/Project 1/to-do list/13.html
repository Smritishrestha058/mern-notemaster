<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income and Expenses Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .input-group {
            margin: 10px 0;
        }
        canvas {
            max-width: 600px;
        }
    </style>
</head>
<body>

    <h2>Income and Expenses Tracker</h2>

    <div class="input-group">
        <label for="entry-type">Entry Type: </label>
        <select id="entry-type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
    </div>

    <div class="input-group">
        <label for="entry-description">Description: </label>
        <input type="text" id="entry-description" placeholder="Enter description">
    </div>

    <div class="input-group">
        <label for="entry-amount">Amount: </label>
        <input type="number" id="entry-amount" placeholder="Enter amount">
    </div>

    <button onclick="addEntry()">Add Entry</button>

    <h3>Summary Chart</h3>
    <canvas id="chart"></canvas>

    <script>
        // Initialize data for the chart
        const data = {
            labels: ['Income', 'Expenses'],
            datasets: [{
                label: 'Amount',
                data: [0, 0], // Initial data
                backgroundColor: ['#4caf50', '#f44336']
            }]
        };

        // Create the chart
        const ctx = document.getElementById('chart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'pie',
            data: data
        });

        // Load stored data from local storage
        function loadStoredData() {
            const storedData = JSON.parse(localStorage.getItem('budgetData')) || { income: 0, expenses: 0 };
            data.datasets[0].data[0] = storedData.income;
            data.datasets[0].data[1] = storedData.expenses;
            chart.update();
        }

        // Add entry to chart and local storage
        function addEntry() {
            const type = document.getElementById('entry-type').value;
            const description = document.getElementById('entry-description').value;
            const amount = parseFloat(document.getElementById('entry-amount').value);

            if (description === '' || isNaN(amount) || amount <= 0) {
                alert('Please enter valid description and amount.');
                return;
            }

            // Update chart data
            if (type === 'income') {
                data.datasets[0].data[0] += amount;
            } else {
                data.datasets[0].data[1] += amount;
            }

            // Save updated data to local storage
            const storedData = {
                income: data.datasets[0].data[0],
                expenses: data.datasets[0].data[1]
            };
            localStorage.setItem('budgetData', JSON.stringify(storedData));

            // Update chart
            chart.update();
        }

        // Load data on page load
        loadStoredData();
    </script>

</body>
</html>

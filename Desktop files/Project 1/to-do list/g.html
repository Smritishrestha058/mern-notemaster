<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Effect - Positioned on Right</title>
    <link rel="stylesheet" href="style1.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Lora:wght@400..700&display=swap');

      body {
          margin: 0;
          background: url("1.jpg") no-repeat center center/cover;
          height: 100vh;
          width: 100%;
          position: relative;
      }

      .container {
          position: absolute;
          top: 20%; /* Distance from the top */
          right: 5%; /* Distance from the right */
      }

      #typewriter {
          font-size: 24px;
          font-family: "Gloria Hallelujah", cursive;
          line-height: 1;
          white-space: nowrap;
          overflow: hidden;
          transform: rotate(-20deg);
          display: inline-block;
          vertical-align: bottom;
      }
    </style>
</head>
<body>
  <div class="container">
    <div id="typewriter"><span></span></div>
  </div>

  <script>
    const text = "Need Help?";
    let index = 0; // Start at the beginning of the text
    const speed = 100; // Speed of typing in milliseconds

    function typeWriter() {
      if (index < text.length) {
        document.querySelector("#typewriter span").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, speed);
      }
    }

    window.onload = () => {
      document.querySelector("#typewriter span").innerHTML = ""; // Clear any existing content
      typeWriter();
    };
  </script>
</body>
</html>

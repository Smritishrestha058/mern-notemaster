<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="todo-container">
        <h1>Expenses</h1>
        <form id="expenses-form">
            <input type="text" id="expenses-input" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>
        <ul id="expenses-list">
            <li>Food</li>
            <li>Clothing</li>
            <li>Fruits</li>
            <li>Shopping</li>
            <li>Transportation</li>
            <li>Travel</li>
            <li>Gift</li>
            <li>Education</li>
            <li>Vegetables</li>
            <li>Snacks</li>
            <li>Electronics</li>
            <li>Health</li>
            <li>Entertainment</li>
            <li>Book</li>
        </ul>
    </div>
    <div class="todo-container">
        <h1>Income</h1>
        <form id="income-form">
            <input type="text" id="income-input" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>
        <ul id="income-list">
            <li>Rental</li>
            <li>Salary</li>
            <li>Dividends</li>
            <li>Coupons</li>
            <li>Awards</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>

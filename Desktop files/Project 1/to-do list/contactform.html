<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body{
          height: 100vh;
          width: 100vw;
            display: grid;
            place-content: center;
            background-color: #f1f1f1;
        }
        .contact_form{
          height: 500px;
          width: 550px;
          display: grid;
          place-content: center;
        }
        h1{
          font-family: sans-serif;
          padding: 10px 0px;
        }
        .input-group{
          margin: 15px 0px;
          width: 400px;
        }
        .input-group input{
          width: 100%;
          padding: 10px;
          font-size: 1em;
          border: none;
          outline: none;
          border-radius: 5px;
        }
        .input-group textarea{
          width: 100%;
          resize: none;
          padding: 10px;
          border: none;
          outline: none;
          font-size: 1.5em;
          border-radius: 5px;
        }
        .Send{
          width: 40%;
          height: 40px;
          font-size: 1.5em;
          border-radius: 5px;
          border: none;
          outline: none;
          background-color: rgb(36, 36, 155);
          color: white;
        }
        .Send:hover{
          background-color: rgb(49, 57, 214);
          color: black;
        }
    </style
</head>
<body>
        <div class="contact_form">
          <h1>Contact Us</h1>
          <form>
            <div class="input-group">
              <input type="text" name="Name" id="Name" placeholder="Name" required>
            </div>
            <div class="input-group">
              <input type="email" name="Email" id="Email" placeholder="Email" required>
            </div>
            <div class="input-group">
              <textarea cols="" rows="5" placeholder="Your message here"></textarea>
            </div>
            <input type="submit" class="Send" value="Send" name="Send">
          </form>
        </div>
      
</body>
</html>

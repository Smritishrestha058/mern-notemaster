<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Categories</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="expenses-container">
        <h1>Expenses</h1>
        <form id="expenses-form">
            <input type="text" id="expenses-input" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>
        <ul id="expenses-list">
            <li>Food <button class="delete-btn">Delete</button></li>
            <li>Clothing <button class="delete-btn">Delete</button></li>
            <li>Fruits <button class="delete-btn">Delete</button></li>
            <li>Shopping <button class="delete-btn">Delete</button></li>
            <li>Transportation <button class="delete-btn">Delete</button></li>
            <li>Travel <button class="delete-btn">Delete</button></li>
            <li>Gift <button class="delete-btn">Delete</button></li>
            <li>Education <button class="delete-btn">Delete</button></li>
            <li>Vegetables <button class="delete-btn">Delete</button></li>
            <li>Snacks <button class="delete-btn">Delete</button></li>
            <li>Electronics <button class="delete-btn">Delete</button></li>
            <li>Health <button class="delete-btn">Delete</button></li>
            <li>Entertainment <button class="delete-btn">Delete</button></li>
            <li>Book <button class="delete-btn">Delete</button></li>
        </ul>
    </div>
    <div class="income-container">
        <h1>Income</h1>
        <form id="income-form">
            <input type="text" id="income-input" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>
        <ul id="income-list">
            <li>Rental <button class="delete-btn">Delete</button></li>
            <li>Salary <button class="delete-btn">Delete</button></li>
            <li>Dividends <button class="delete-btn">Delete</button></li>
            <li>Coupons <button class="delete-btn">Delete</button></li>
            <li>Awards <button class="delete-btn">Delete</button></li>
        </ul>
    </div>
    <script>
        // Get the forms and lists
        const expensesForm = document.getElementById('expenses-form');
        const incomeForm = document.getElementById('income-form');
        const expensesList = document.getElementById('expenses-list');
        const incomeList = document.getElementById('income-list');
        
        // Add event listeners to the forms
        expensesForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputValue = document.getElementById('expenses-input').value;
            const newListItem = document.createElement('li');
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'delete-btn';
            newListItem.textContent = inputValue;
            newListItem.appendChild(deleteBtn);
            expensesList.appendChild(newListItem);
            document.getElementById('expenses-input').value = '';
            
            // Add event listener to the new delete button
            deleteBtn.addEventListener('click', (e) => {
                const li = e.target.parentNode;
                li.remove();
            });
        });
        
        incomeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputValue = document.getElementById('income-input').value;
            const newListItem = document.createElement('li');
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'delete-btn';
            newListItem.textContent = inputValue;
            newListItem.appendChild(deleteBtn);
            incomeList.appendChild(newListItem);
            document.getElementById('income-input').value = '';
            
            // Add event listener to the new delete button
            deleteBtn.addEventListener('click', (e) => {
                const li = e.target.parentNode;
                li.remove();
            });
            
        });
        // Get all delete buttons
        const deleteBtns = document.querySelectorAll('.delete-btn');
        
        // Add event listener to each delete button
        deleteBtns.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                // Get the parent list item
                const li = e.target.parentNode;
                // Remove the list item
                li.remove();
            });
        });
    </script>
</body>
</html>

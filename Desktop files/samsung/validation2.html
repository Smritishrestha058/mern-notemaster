<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation</title>
    <style>
        .error {
            color: red;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <label for="password">Enter Password:</label>
    <input type="password" id="password">
    <label>
        <input type="checkbox" id="togglePassword"> Show Password
    </label>

    <p id="error-length" class="error">❌ Must be at least 8 characters long</p>
    <p id="error-uppercase" class="error">❌ Must contain at least one uppercase letter</p>
    <p id="error-lowercase" class="error">❌ Must contain at least one lowercase letter</p>
    <p id="error-number" class="error">❌ Must contain at least one number</p>
    <p id="error-special" class="error">❌ Must contain at least one special character (@$!%*?&)</p>

    <script>
        document.getElementById("password").addEventListener("change", function() {
            let password = this.value;

            // Define regex patterns
            let lengthCheck = password.length >= 8;
            let uppercaseCheck = /[A-Z]/.test(password);
            let lowercaseCheck = /[a-z]/.test(password);
            let numberCheck = /[0-9]/.test(password);
            let specialCheck = /[@$!%*?&]/.test(password);

            // Show relevant error messages only
            document.getElementById("error-length").style.display = lengthCheck ? "none" : "block";
            document.getElementById("error-uppercase").style.display = uppercaseCheck ? "none" : "block";
            document.getElementById("error-lowercase").style.display = lowercaseCheck ? "none" : "block";
            document.getElementById("error-number").style.display = numberCheck ? "none" : "block";
            document.getElementById("error-special").style.display = specialCheck ? "none" : "block";
        });
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("change", function() {
            passwordInput.type = this.checked ? "text" : "password";
        });
    </script>

</body>
</html>
